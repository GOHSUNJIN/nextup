  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

der=\"stroke\" transform=\"rotate(-8 120 150)\">UP<\u002Ftext><\u002Fsvg>\n        <div style=\"display: flex; flex-direction: column; gap: 1px\">\n          <span style=\"font-family: 'Luckiest Guy', sans-serif; font-size: 24px; line-height: 1; letter-spacing: 0.5px; color: #FFFFFF; -webkit-text-stroke: 1.2px #111111; text-shadow: 2px 2px 0 #111111\">NEXT<span style=\"color: #FFC72C\">UP<\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 10px; font-weight: 800; letter-spacing: 1.5px\">BY PICKLEPEDIA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 8px\">\n        <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 2px\"><span style=\"font-size: 13px; font-weight: 800; line-height: 1.1; white-space: nowrap\">{{ hdrName }}<\u002Fspan><span style=\"{{ hdrRoleStyle }}\">{{ hdrRole }}<\u002Fspan><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"{{ hdrAvatarStyle }}\">\n          <sc-if value=\"{{ isGuestHdr }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4740\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ notGuestHdr }}\" hint-placeholder-val=\"{{ true }}\">{{ initials }}<\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <main style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px\">\n\n      <sc-if value=\"{{ showEvents }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ closeEvents }}\" aria-label=\"Back\" style=\"width: 44px; height: 44px; border-radius: 12px; border: 2px solid #111111; ba 002Fh2>\n            <\u002Fdiv>\n            <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Name<input type=\"text\" value=\"{{ form.title }}\" sc-camel-on-change=\"{{ onFormTitle }}\" placeholder=\"e.g. Friday Night Social\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box\"><\u002Flabel>\n            <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Date<input type=\"date\" value=\"{{ form.date }}\" sc-camel-on-change=\"{{ onFormDate }}\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 10px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; min-width: 0\"><\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Start<input type=\"time\" value=\"{{ form.time }}\" sc-camel-on-change=\"{{ onFormTime }}\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 10px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; min-width: 0\"><\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Courts<input type=\"number\" value=\"{{ form.courts }}\" sc-camel-on-change=\"{{ onFormCourts }}\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 10px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; min-width: 0\"><\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Max players<input type=\"number\" value=\"{{ form.max }}\" sc-camel-on-change=\"{{ onFormMax }}\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 10px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; min-width: 0\"><\u002Flabel>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ createEvent }}\" style=\"height: 52px; border-radius: 14px; border: 2px solid #111111; background: #D2281F; box-shadow: 3px 3px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">CREATE EVENT<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasLiveEvents }}\" hint-placeholder-val=\"{{ true }}\">\n          <h2 style=\"margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">LIVE NOW<\u002Fh2>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ liveEvents }}\" as=\"ev\" hint-placeholder-count=\"1\">\n          <article style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n              <span style=\"font-size: 16px; font-weight: 800\">{{ ev.title }}<\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 800; background: #D2281F; color: #FFFFFF; border-radius: 999px; padding: 2px 8px\">Live<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 13px; font-weight: 600\">{{ ev.when }}<\u002Fspan>\n            <span style=\"font-size: 12px; color: #4A4740\">{{ ev.meta }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ ev.action }}\" style=\"height: 48px; border-radius: 14px; border: 2px solid #111111; background: #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 19px\">{{ ev.actionLabel }}<\u002Fbutton>\n          <\u002Farticle>\n        <\u002Fsc-for>\n\n        <h2 style=\"margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">UPCOMING<\u002Fh2>\n        <sc-for list=\"{{ upcomingEvents }}\" as=\"ev\" hint-placeholder-count=\"1\">\n          <article style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n              <span style=\"font-size: 16px; font-weight: 800\">{{ ev.title }}<\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 800; border: 1.5px solid #111111; border-radius: 999px; padding: 1px 8px\">Upcoming<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 13px; font-weight: 600\">{{ ev.when }}<\u002Fspan>\n            <span style=\"font-size: 12px; color: #4A4740\">{{ ev.meta }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ ev.action }}\" style=\"{{ ev.actionStyle }}\">{{ ev.actionLabel }}<\u002Fbutton>\n          <\u002Farticle>\n        <\u002Fsc-for>\n\n        <h2 style=\"margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">PAST<\u002Fh2>\n        <sc-for list=\"{{ pastEvents }}\" as=\"ev\" hint-placeholder-count=\"1\">\n          <article style=\"background: #FFFFFF; border: 2px solid #8A867C; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n              <span style=\"font-size: 16px; font-weight: 800\">{{ ev.title }}<\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 800; background: #ECEAE4; color: #4A4740; border-radius: 999px; padding: 2px 8px\">Ended<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 13px; font-weight: 600\">{{ ev.when }}<\u002Fspan>\n            <span style=\"font-size: 12px; color: #4A4740\">{{ ev.summary }}<\u002Fspan>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showCourts }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between\">\n          <h1 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 34px; line-height: 1\">COURTS<\u002Fh1>\n          <button type=\"button\" sc-camel-on-click=\"{{ openEvents }}\" style=\"height: 40px; border-radius: 999px; border: 2px solid #111111; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800; padding: 0 14px; display: flex; align-items: center; gap: 6px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg>All events<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ notEnded }}\" hint-placeholder-val=\"{{ true }}\">\n          <section style=\"background: #111111; color: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 10px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; line-height: 1\">WEDNESDAY OPEN PLAY<\u002Fspan>\n                <span style=\"font-size: 12px; font-weight: 600; color: #BDB9AF\">Tonight · 7:00 to 10:00 PM<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px; background: #D2281F; color: #FFFFFF; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; flex-shrink: 0\"><span style=\"width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF\"><\u002Fspan>Live<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #232323; border-radius: 12px\">\n              <div style=\"padding: 10px 12px; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 30px; line-height: 1; color: #FFC72C\">{{ courtCount }}<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #BDB9AF\">Courts<\u002Fspan><\u002Fdiv>\n              <div style=\"padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #3A3A3A\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 30px; line-height: 1; color: #FFC72C\">{{ playingCount }}<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #BDB9AF\">Playing<\u002Fspan><\u002Fdiv>\n              <div style=\"padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #3A3A3A\"><span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 30px; line-height: 1; color: #FFC72C\">{{ queueCount }}<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #BDB9AF\">In queue<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isGuest }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #111111; color: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px\">\n            <span style=\"flex: 1; font-size: 13px; font-weight: 600; line-height: 1.45\">You're viewing as a guest. Sign up to join the queue and pick a partner.<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ openSheet }}\" style=\"height: 44px; border-radius: 12px; border: 0; background: #FFC72C; color: #111111; font-family: Inter, sans-serif; font-size: 14px; font-weight: 800; padding: 0 14px; flex-shrink: 0\">Sign up<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ ended }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px\">EVENT ENDED<\u002Fspan>\n            <span style=\"font-size: 13px; color: #4A4740\">Thanks for playing! Check All events for the next session.<\u002Fspan>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ notEnded }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-for list=\"{{ courtItems }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <article style=\"{{ c.cardStyle }}\">\n              <div style=\"{{ c.tileStyle }}\">{{ c.num }}<\u002Fdiv>\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"display: flex; gap: 6px; align-items: center; flex-wrap: wrap\">\n                  <span style=\"font-weight: 800; font-size: 15px\">{{ c.name }}<\u002Fspan>\n                  <span style=\"font-size: 11px; font-weight: 800; border: 1.5px solid #111111; border-radius: 999px; padding: 1px 8px\">{{ c.type }}<\u002Fspan>\n                  <span style=\"{{ c.statusStyle }}\">{{ c.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ c.hasTeams }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size: 13px; line-height: 1.4\">{{ c.teamA }} <span style=\"color: #4A4740; font-weight: 700\">vs<\u002Fspan> {{ c.teamB }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ c.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size: 13px; line-height: 1.4; color: #4A4740\">Waiting for enough players…<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showQueue }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 34px; line-height: 1\">QUEUE<\u002Fh1>\n\n        <sc-if value=\"{{ ended }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; padding: 18px; font-size: 14px; font-weight: 600\">This event has ended. The queue is closed.<\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ guestQueue }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px\">WANT TO PLAY?<\u002Fspan>\n            <span style=\"font-size: 13px; line-height: 1.5; color: #2E2C27\">Guests can watch the queue. To join solo or pick a partner, create a free account first.<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ openSheet }}\" style=\"height: 52px; border-radius: 14px; border: 2px solid #111111; background: #D2281F; box-shadow: 3px 3px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">SIGN UP TO JOIN<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ needVenue }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; align-items: center; gap: 10px\">\n              <div style=\"width: 44px; height: 44px; border-radius: 12px; background: #FFC72C; border: 2px solid #111111; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#111111\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22s8-6 8-12a8 8 0 0 0-16 0c0 6 8 12 8 12z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n              <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; line-height: 1\">CHECK IN AT THE VENUE<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 13px; line-height: 1.5; color: #2E2C27\">You need to be at the courts to queue. Scan the QR code on the admin's screen.<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ scan }}\" style=\"height: 56px; border-radius: 16px; border: 2px solid #111111; background: #D2281F; box-shadow: 4px 4px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10\"><\u002Fpath><\u002Fsvg>SCAN VENUE QR<\u002Fbutton>\n            <label for=\"vcode\" style=\"font-size: 12px; font-weight: 800; text-align: center\">Or enter the 4-digit code<\u002Flabel>\n            <div style=\"display: flex; gap: 8px\">\n              <input id=\"vcode\" type=\"text\" inputmode=\"numeric\" maxlength=\"4\" value=\"{{ codeInput }}\" sc-camel-on-change=\"{{ onCodeInput }}\" placeholder=\"0000\" style=\"flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 6px; text-align: center; box-sizing: border-box\">\n              <button type=\"button\" sc-camel-on-click=\"{{ verifyCode }}\" style=\"height: 48px; border-radius: 12px; border: 2px solid #111111; background: #111111; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 800; padding: 0 16px\">Verify<\u002Fbutton>\n            <\u002Fdiv>\n            <span style=\"font-size: 12px; color: #4A4740; text-align: center\">Demo tip: switch to Admin, open Check-in and read the code.<\u002Fspan>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qsNone }}\" hint-placeholder-val=\"{{ true }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n              <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px\">JOIN TONIGHT'S QUEUE<\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 800; background: #DDF3E4; color: #17603A; border-radius: 999px; padding: 2px 8px; flex-shrink: 0\">At venue ✓<\u002Fspan>\n            <\u002Fdiv>\n            <div role=\"group\" aria-label=\"Play mode\" style=\"display: flex; border: 2px solid #111111; border-radius: 999px; overflow: hidden\">\n              <button type=\"button\" sc-camel-on-click=\"{{ pickSolo }}\" style=\"{{ segSolo }}\">Solo<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ pickPair }}\" style=\"{{ segPair }}\">Pair<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasPartner }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; gap: 10px; background: #DDF3E4; border: 2px solid #111111; border-radius: 14px; padding: 10px 12px\">\n                <span style=\"flex: 1; font-size: 14px; font-weight: 700\">Paired with {{ partnerName }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ clearPartner }}\" style=\"height: 36px; border-radius: 10px; border: 2px solid #111111; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800; padding: 0 12px\">Change<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showSearch }}\" hint-placeholder-val=\"{{ false }}\">\n              <label for=\"psearch\" style=\"font-size: 12px; font-weight: 800\">Find your partner<\u002Flabel>\n              <input id=\"psearch\" type=\"search\" value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search name or player ID\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; width: 100%\">\n              <sc-if value=\"{{ showPending }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 13px; font-weight: 600; background: #FFF4D1; border: 1.5px dashed #111111; border-radius: 12px; padding: 8px 10px\">Request sent to {{ pendingName }}. Waiting for them to accept…<\u002Fdiv>\n              <\u002Fsc-if>\n              <ul style=\"list-style: none; margin: 0; padding: 0; border: 2px solid #111111; border-radius: 14px; overflow: hidden\">\n                <sc-for list=\"{{ results }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <li style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-bottom: 1px solid #E3E0D8\">\n                    <span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-size: 14px; font-weight: 700\">{{ p.name }}<\u002Fspan><span style=\"font-size: 11px; color: #4A4740\">ID #{{ p.pid }} · {{ p.where }}<\u002Fspan><\u002Fspan>\n                    <button type=\"button\" sc-camel-on-click=\"{{ p.request }}\" style=\"height: 36px; border-radius: 10px; border: 2px solid #111111; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 13px; font-weight: 800; padding: 0 12px\">{{ p.btnLabel }}<\u002Fbutton>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 13px; color: #4A4740\">No players found.<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <button type=\"button\" sc-camel-on-click=\"{{ join }}\" style=\"height: 56px; border-radius: 16px; border: 2px solid #111111; background: #D2281F; box-shadow: 4px 4px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px\">{{ joinLabel }}<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qsWaiting }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"position: relative; background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 16px 18px; overflow: hidden\">\n            <svg sc-camel-view-box=\"0 0 300 300\" width=\"200\" height=\"200\" aria-hidden=\"true\" style=\"position: absolute; right: -44px; top: -40px\"><polygon points=\"150,0 170,34 201,9 209,48 246,35 240,74 280,75 261,110 298,124 268,150 298,176 261,190 280,225 240,226 246,265 209,252 201,291 170,266 150,300 130,266 99,291 91,252 54,265 60,226 20,225 39,190 2,176 32,150 2,124 39,110 20,75 60,74 54,35 91,48 99,9 130,34\" fill=\"#FFC72C\"><\u002Fpolygon><\u002Fsvg>\n            <div style=\"position: relative; display: flex; flex-direction: column\">\n              <span style=\"font-size: 11px; font-weight: 800; \">Your position · {{ myModeLabel }}<\u002Fspan>\n              <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 104px; line-height: 0.9\">#{{ pos }}<\u002Fspan>\n              <div style=\"display: flex; gap: 20px; margin-top: 6px\">\n                <div style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #4A4740; font-weight: 600\">Est. wait<\u002Fspan><span style=\"font-size: 18px; font-weight: 800\">{{ estWait }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column\"><span style=\"font-size: 12px; color: #4A4740; font-weight: 600\">Strikes<\u002Fspan><span style=\"font-size: 18px; font-weight: 800\">{{ strikes }} / 2<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <sc-if value=\"{{ isNext }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; align-items: center; gap: 10px; background: #D2281F; color: #FFFFFF; border: 2px solid #111111; border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 800\">You're next! Head to the courts.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notNext }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; align-items: center; gap: 10px; background: #111111; color: #FFFFFF; border-radius: 14px; padding: 1 am }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <div style=\"display: flex; align-items: center; justify-content: center; gap: 12px\">\n            <span style=\"font-size: 13px; font-weight: 700\">Check in within<\u002Fspan>\n            <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 40px; line-height: 1\">{{ checkinText }}<\u002Fspan>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ checkIn }}\" style=\"height: 60px; border-radius: 16px; border: 2px solid #111111; background: #D2281F; box-shadow: 4px 4px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 26px\">I'M HERE<\u002Fbutton>\n          <p style=\"margin: 0; font-size: 12px; line-height: 1.5; text-align: center; color: #4A4740\">No check-in by 0:00 and the standby player takes your slot.<\u002Fp>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ qsPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n          <section style=\"background: #FFFFFF; border: 2px solid #111111; border-radius: 18px; box-shadow: 4px 4px 0 #111111; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between\">\n              <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 26px\">ON {{ myCourtNameUpper }}<\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 800; background: #DDF3E4; color: #17603A; border-radius: 999px; padding: 2px 8px\">Checked in<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 14px; font-weight: 700\">{{ myTeam }}<\u002Fspan>\n            <span style=\"font-size: 13px; color: #4A4740\">vs {{ oppTeam }}<\u002Fspan>\n          <\u002Fsection>\n          <p style=\"margin: 0; font-size: 13px; line-height: 1.5; ype=\"button\" sc-camel-on-click=\"{{ goProfile }}\" style=\"{{ navProfile }}\">\n        <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6\"><\u002Fpath><\u002Fsvg>Profile<\u002Fbutton>\n      <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goAdmin }}\" style=\"{{ navAdmin }}\">\n          <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\u002Fpath><\u002Fsvg>Admin<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fnav>\n\n    <sc-if value=\"{{ scanning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" style=\"position: absolute; inset: 0; background: rgba(17,17,17,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px\">\n        <div style=\"width: 220px; height: 220px; position: relative\">\n          <div style=\"position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-left: 5px solid #FFC72C; border-top: 5px solid #FFC72C; border-radius: 12px 0 0 0\"><\u002Fdiv>\n          <div style=\"position: absolute; right: 0; top: 0; width: 44px; height: 44px; border-right: 5px solid #FFC72C; border-top: 5px solid #FFC72C; border-radius: 0 12px 0 0\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 0; bottom: 0; width: 44px; height: 44px; border-left: 5px solid #FFC72C; border-bottom: 5px solid #FFC72C; border-radius: 0 0 0 12px\"><\u002Fdiv>\n          <div style=\"position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; border-right: 5px solid #FFC72C; border-bottom: 5px solid #FFC72C; border-radius: 0 0 12px 0\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 20px; right: 20px; top: 108px; height: 3px; background: #D2281F; border-radius: 2px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; color: #FFFFFF\">SCANNING VENUE QR…<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sheet }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(17,17,17,0.6); display: flex; flex-direction: column; justify-content: flex-end\">\n        <section role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"signupTitle\" style=\"background: #FFFFFF; border-top: 2px solid #111111; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 10px\">\n          <h2 id=\"signupTitle\" style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 30px; line-height: 1\">SIGN UP TO PLAY<\u002Fh2>\n          <span style=\"font-size: 13px; line-height: 1.5; color: #2E2C27\">Join the queue solo or with a partner and get pinged when you're up.<\u002Fspan>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Name<input type=\"text\" placeholder=\"Your name\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box\"><\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Email<input type=\"email\" placeholder=\"you@example.com\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box\"><\u002Flabel>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n            <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Phone<input type=\"tel\" placeholder=\"9123 4567\" style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 12px; font-family: Inter, sans-serif; font-size: 14px; box-sizing: border-box; min-width: 0\"><\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800\">Gender<sc-raw-select style=\"height: 44px; border-radius: 12px; border: 2px solid #111111; padding: 0 10px; font-family: Inter, sans-serif; font-size: 14px; background: #FFFFFF; min-width: 0\"><option>Male<\u002Foption><option>Female<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 12px; line-height: 1.45; color: #2E2C27\"><input type=\"checkbox\" style=\"width: 20px; height: 20px; margin: 0; flex-shrink: 0\">I agree to NextUp collecting my email, phone and gender to run the queue (PDPA).<\u002Flabel>\n          <button type=\"button\" sc-camel-on-click=\"{{ signup }}\" style=\"height: 56px; border-radius: 16px; border: 2px solid #111111; background: #D2281F; box-shadow: 4px 4px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 22px\">CREATE ACCOUNT<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ closeSheet }}\" style=\"height: 44px; border: 0; background: transparent; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700; color: #4A4740\">Not now<\u002Fbutton>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ confirmEnd }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(17,17,17,0.6); display: flex; align-items: center; justify-content: center; padding: 20px\">\n        <section role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"endTitle\" style=\"width: 100%; background: #FFFFFF; border: 2px solid #111111; border-radius: 22px; box-shadow: 5px 5px 0 #111111; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n          <h2 id=\"endTitle\" style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 30px; line-height: 1\">END THIS EVENT?<\u002Fh2>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #2E2C27\">All courts stop and everyone is removed from the queue. This can't be undone.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ cancelEnd }}\" style=\"height: 52px; border-radius: 14px; border: 2px solid #111111; background: #FFFFFF; color: #111111; font-family: Inter, sans-serif; font-size: 15px; font-weight: 800\">Cancel<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ endEvent }}\" style=\"height: 52px; border-radius: 14px; border: 2px solid #111111; background: #D2281F; box-shadow: 3px 3px 0 #111111; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 20px\">END EVENT<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:936}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.nid = 1;\n    this.state = this.initialState();\n  }\n\n  mk(name, slots, extra) {\n    this.nid = (this.nid || 1) + 1;\n    return Object.assign({ id: 'p' + this.nid, name: name, slots: slots, you: false, walkin: false }, extra || {});\n  }\n\n  initialState() {\n    return {\n      role: 'player', tab: 'courts', screen: null, sheet: false, confirmEnd: false, ended: false,\n      adminView: 'courts', showCreate: false,\n      courts: [\n        { name: 'Court 1', type: 'Open', status: 'playing', mins: 12, players: [this.mk('Alex T.', 1), this.mk('Dana L.', 1), this.mk('Ben C.', 1), this.mk('Cal W.', 1)] },\n        { name: 'Court 2', type: 'Mixed', status: 'playing', mins: 4, players: [this.mk('Eve S. + Hal P.', 2), this.mk('Ivy N. + Jon K.', 2)] },\n        { name: 'Court 3', type: 'Women', status: 'playing', mins: 9, players: [this.mk('Kim L.', 1), this.mk('Mia R.', 1), this.mk('Nia W.', 1), this.mk('Zoe T.', 1)] },\n        { name: 'Court 4', type: 'Open', status: 'playing', mins: 2, players: [this.mk('Pam O.', 1), this.mk('Quinn A.', 1), this.mk('Raj S.', 1), this.mk('Sue Y.', 1)] }\n      ],\n      queue: [this.mk('Leo B. + Sam K.', 2), this.mk('Ray C.', 1)],\n      extras: false,\n      qs: 'none', mode: 'solo', search: '', partner: null, pairPending: null,\n      myCourt: null, checkin: 180, choiceLeft: 60, strikes: 0, games: 0, matchesDone: 0, walkinsAdded: 0,\n      pending: null, toast: '', toastLeft: 0, walkin: '', reason: '',\n      atVenue: false, scanning: false, codeInput: '', venueCode: this.newCode(), qrLeft: 60, checkedInCount: 17,\n      noStrong: false, push: true, reminded: {}, qPage: 1, hPage: 1,\n      form: { title: '', date: '', time: '', courts: '4', max: '32' },\n      events: [\n        { id: 'e1', title: 'Wednesday Open Play', when: 'Tonight · 7:00 to 10:00 PM', courts: '4', max: '32', status: 'live' },\n        { id: 'e2', title: 'Weekend Social', when: 'Sat 25 Oct · 9:00 AM to 12:00 PM', courts: '6', max: '40', status: 'upcoming' },\n        { id: 'e3', title: 'Friday Night Doubles', when: 'Fri 31 Oct · 7:30 to 10:30 PM', courts: '4', max: '32', status: 'upcoming' },\n        { id: 'e0', title: 'Sunday Open Play', when: 'Sun 19 Oct · 4:00 to 7:00 PM', courts: '4', max: '32', status: 'past', summary: '38 matches · 29 players' }\n      ]\n    };\n  }\n\n  newCode() { return String(Math.floor(1000 + Math.random() * 9000)); }\n\n  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.pairTimer); clearTimeout(this.scanTimer); }\n\n  tick() {\n    const s = this.state;\n    if (s.qrLeft <= 1) { this.setState({ qrLeft: 60, venueCode: this.newCode() }); }\n    else { this.setState({ qrLeft: s.qrLeft - 1 }); }\n    if (s.pending) {\n      if (s.pending.left <= 1) { this.commitEnd(s.pending.court); return; }\n      this.setState({ pending: { court: s.pending.court, left: s.pending.left - 1 } });\n    }\n    if (s.qs === 'assigned') {\n      if (s.checkin <= 1) { this.missed(); return; }\n      this.setState({ checkin: s.checkin - 1 });\n    }\n    if (s.qs === 'finished') {\n      if (s.choiceLeft <= 1) { this.setState({ qs: 'break', choiceLeft: 60, toast: 'No choice made, so you are on break.', toastLeft: 3 }); return; }\n      this.setState({ choiceLeft: s.choiceLeft - 1 });\n    }\n    if (s.toastLeft > 0) {\n      const left = s.toastLeft - 1;\n      this.setState({ toastLeft: left, toast: left <= 0 ? '' : s.toast });\n    }\n  }\n\n  flash(msg) { this.setState({ toast: msg, toastLeft: 3 }); }\n\n  teams(players) {\n    const pairs = players.filter(p => p.slots === 2);\n    const solos = players.filter(p => p.slots === 1);\n    if (pairs.length === 2) return [pairs[0].name, pairs[1].name];\n    if (pairs.length === 1 && solos.length >= 2) return [pairs[0].name, solos[0].name + ' + ' + solos[1].name];\n    if (solos.length >= 4) return [solos[0].name + ' + ' + solos[3].name, solos[1].name + ' + ' + solos[2].name];\n    return [players.map(p => p.name).join(', '), ''];\n  }\n\n  fillAll(courts, queue) {\n    const upd = {};\n    courts.forEach((c, i) => {\n      if (c.status !== 'empty') return;\n      const picks = [];\n      const rest = [];\n      let slots = 0;\n      queue.forEach(q => {\n        if (slots < 4 && slots + q.slots <= 4) { picks.push(q); slots += q.slots; } else { rest.push(q); }\n      });\n      if (slots < 4) return;\n      queue = rest;\n      const hasMe = picks.some(p => p.you);\n      courts[i] = Object.assign({}, c, { players: picks, status: hasMe ? 'checking' : 'playing', mins: 0 });\n      if (hasMe) { upd.qs = 'assigned'; upd.myCourt = i; upd.checkin = 180; }\n    });\n    return { courts: courts, queue: queue, upd: upd };\n  }\n\n  copyCourts() { return this.state.courts.map(c => Object.assign({}, c)); }\n\n  meEntry() {\n    const s = this.state;\n    return this.mk(s.partner ? 'You + ' + s.partner : 'You', s.partner ? 2 : 1, { you: true });\n  }\n\n  join() {\n    const s = this.state;\n    if (s.role === 'guest') { this.setState({ sheet: true }); return; }\n    if (s.ended) { this.flash('This event has ended.'); return; }\n    if (!s.atVenue) { this.flash('Check in at the venue first.'); return; }\n    if (s.mode === 'pair' && !s.partner) { this.flash('Pick a partner first, or switch to Solo.'); return; }\n    let queue = s.queue.filter(q => q.name !== s.partner).concat([this.meEntry()]);\n    const extra = {};\n    if (!s.extras) { queue = queue.concat([this.mk('Tia M.', 1), this.mk('Uma P. + Vic L.', 2)]); extra.extras = true; }\n    const r = this.fillAll(this.copyCourts(), queue);\n    this.setState(Object.assign({ qs: 'waiting' }, extra, { courts: r.courts, queue: r.queue }, r.upd));\n    this.flash(s.partner ? 'You and ' + s.partner + ' joined the queue.' : 'You joined the queue.');\n  }\n\n  requeue() {\n    const s = this.state;\n    const r = this.fillAll(this.copyCourts(), s.queue.concat([this.meEntry()]));\n    this.setState(Object.assign({ qs: 'waiting' }, { courts: r.courts, queue: r.queue }, r.upd));\n  }\n\n  leave() {\n    this.setState({ queue: this.state.queue.filter(q => !q.you), qs: 'none' });\n    this.flash('You left the queue.');\n  }\n\n  skip() {\n    const q = this.state.queue.slice();\n    const i = q.
